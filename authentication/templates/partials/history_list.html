{% load static %}
<div class="space-y-1">
    {% if history %}
        {% for entry in history %}
        <button @click="loadHistoryItem({{ entry.id }})"
                class="w-full flex items-center justify-between px-2 py-1.5 rounded-md hover:bg-black/5 text-xs text-left group">
            <div class="flex items-center space-x-2 flex-1 min-w-0">
                <span class="font-mono font-bold text-[10px] px-1.5 py-0.2 rounded
                    {% if entry.status_category == 'success' %}bg-emerald-100 text-emerald-700
                    {% elif entry.status_category == 'redirect' %}bg-blue-100 text-blue-700
                    {% elif entry.status_category == 'client_error' %}bg-amber-100 text-amber-700
                    {% else %}bg-rose-100 text-rose-700{% endif %}">
                    {{ entry.status_code }}
                </span>
                <span class="font-mono text-[10px] text-[#8e8e93]">{{ entry.method }}</span>
                <span class="truncate text-[11px] text-[#1c1c1e]">{{ entry.url|truncatechars:40 }}</span>
            </div>
            <span class="text-[9px] text-[#8e8e93] font-mono whitespace-nowrap ml-2">{{ entry.elapsed_ms|floatformat:0 }}ms</span>
        </button>
        {% endfor %}
    {% else %}
        <div class="text-xs text-[#8e8e93] italic px-2 py-4 text-center">No history yet. Send a request!</div>
    {% endif %}
</div>
