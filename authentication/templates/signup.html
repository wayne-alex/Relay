{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f2f2f7]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relay | Create Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 text-[#1c1c1e]">

<div class="w-full max-w-[360px] space-y-6">

    <!-- App Icon & Header -->
    <div class="text-center space-y-2">
    <div class="inline-flex items-center justify-center w-16 h-16">
        <img src="{% static 'relay_logo.svg' %}" alt="Relay Logo" class="w-full h-full object-contain">
    </div>
    <div>
        <h1 class="text-2xl font-bold tracking-tight text-[#1c1c1e]">Relay</h1>
        <p class="text-[13px] text-[#8e8e93] font-normal">API Testing Engine</p>
    </div>
</div>

    <!-- Form Card (iOS Grouped Style) -->
    <form method="POST" action="{% url 'signup' %}" class="space-y-5">
        {% csrf_token %}

        {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
            <div class="p-3 text-[13px] text-[#ff3b30] bg-[#ff3b30]/10 rounded-xl text-center font-medium">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Form Group Block -->
        <div class="bg-white/80 backdrop-blur-md rounded-2xl shadow-[0_1px_3px_rgba(0,0,0,0.05)] ring-1 ring-black/5 overflow-hidden">

            <!-- Username -->
            <div class="px-4 py-3 border-b border-[#e5e5ea]">
                <label for="username"
                       class="block text-[11px] font-medium uppercase tracking-wider text-[#8e8e93] mb-0.5">
                    Username
                </label>
                <input
                        type="text"
                        name="username"
                        id="username"
                        required
                        autocomplete="username"
                        placeholder="alex_dev"
                        class="w-full bg-transparent text-[15px] text-[#1c1c1e] placeholder-[#c7c7cc] focus:outline-none"
                >
            </div>

            <!-- Email -->
            <div class="px-4 py-3 border-b border-[#e5e5ea]">
                <label for="email" class="block text-[11px] font-medium uppercase tracking-wider text-[#8e8e93] mb-0.5">
                    Email Address
                </label>
                <input
                        type="email"
                        name="email"
                        id="email"
                        required
                        autocomplete="email"
                        placeholder="alex@example.com"
                        class="w-full bg-transparent text-[15px] text-[#1c1c1e] placeholder-[#c7c7cc] focus:outline-none"
                >
            </div>

            <!-- Password -->
            <div class="px-4 py-3 border-b border-[#e5e5ea]">
                <label for="password"
                       class="block text-[11px] font-medium uppercase tracking-wider text-[#8e8e93] mb-0.5">
                    Password
                </label>
                <input
                        type="password"
                        name="password"
                        id="password"
                        required
                        autocomplete="new-password"
                        placeholder="••••••••"
                        class="w-full bg-transparent text-[15px] text-[#1c1c1e] placeholder-[#c7c7cc] focus:outline-none"
                >
            </div>

            <!-- Confirm Password -->
            <div class="px-4 py-3">
                <label for="confirm_password"
                       class="block text-[11px] font-medium uppercase tracking-wider text-[#8e8e93] mb-0.5">
                    Confirm Password
                </label>
                <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        required
                        autocomplete="new-password"
                        placeholder="••••••••"
                        class="w-full bg-transparent text-[15px] text-[#1c1c1e] placeholder-[#c7c7cc] focus:outline-none"
                >
            </div>

        </div>

        <!-- iOS Primary Button -->
        <button
                type="submit"
                class="w-full py-3 px-4 bg-[#007aff] hover:bg-[#0062cc] active:scale-[0.98] text-white text-[15px] font-semibold rounded-2xl shadow-sm transition-all duration-150 ease-in-out"
        >
            Create Account
        </button>
    </form>

    <!-- Back to Login Link -->
    <p class="text-center text-[13px] text-[#8e8e93]">
        Already have an account?
        <a href="{% url 'login' %}" class="text-[#007aff] font-medium hover:underline">Sign in</a>
    </p>


</div>

</body>
</html>
